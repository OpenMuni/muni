plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'data/db/**/*'
    - 'bin/setup'
    - 'bin/test-all'
    - 'bin/lint'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

Style/FrozenStringLiteralComment:
  Enabled: false

Layout/LineLength:
  Max: 120

Layout/ExtraSpacing:
  AllowForAlignment: true

Layout/SpaceAroundOperators:
  AllowForAlignment: true

Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

Bundler/OrderedGems:
  Enabled: false

Gemspec/RequireMFA:
  Enabled: false

Metrics/MethodLength:
  Max: 40

Metrics/AbcSize:
  Max: 40
  Exclude:
    - 'core/lib/muni/store.rb'
    - 'core/lib/muni/helpers/http.rb'

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  Max: 8
  CountKeywordArgs: false

Metrics/ClassLength:
  Max: 250

Metrics/ModuleLength:
  Max: 250
  Exclude:
    - 'core/lib/muni/dashboard.rb'
    - 'core/lib/muni/dashboard/signals.rb'
    - 'core/lib/muni/display.rb'
    - 'core/lib/muni/view.rb'

Metrics/BlockLength:
  Exclude:
    - '**/*.gemspec'
    - '**/spec/**/*'
    - 'Rakefile'
    - 'core/lib/muni/records/**/*'

Lint/DuplicateBranch:
  Enabled: false

Style/OneClassPerFile:
  Exclude:
    - 'core/lib/muni/record.rb'   # colocates Records:: namespace stub
    - 'core/lib/muni/beat.rb'     # colocates Beats:: namespace stub

Style/ClassVars:
  Exclude:
    - 'sources/**/*'
    - 'spec/sources/**/*'

RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - 'www/spec/**/*'

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 10

RSpec/NestedGroups:
  Max: 4
