name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          bundler-cache: true

      - name: Setup from a clean checkout
        run: ./setup

      - name: RSpec
        run: bin/test-all

      - name: RuboCop
        run: bin/lint --cache false

      - name: Real HTTP worker regression
        run: python3 bin/test-http-security.py

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Ruby vulnerability audit
        run: bundle exec bundler-audit check --update
      - name: Browser checks and vulnerability audit
        run: |
          npm ci --ignore-scripts
          npm test
          npm audit --audit-level=low
      - name: Python vulnerability audit
        run: |
          python -m pip install pip-audit
          pip-audit -r mcp/requirements.lock --require-hashes
          python -m pip install --require-hashes -r mcp/requirements.lock
          python mcp/test_registration.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Full-history secret scan
        run: |
          python3 bin/check-public-files.py --history
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history' --ignore-gitleaks-allow --redact=100

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build release image
        run: docker build --pull --tag muni-security-check .
      - name: Exercise the packaged web server and proxy
        run: |
          docker run --detach --name muni-smoke --publish 127.0.0.1:19458:8080 \
            --env RACK_ENV=production --env MUNI_WEB_BEATS=0 muni-security-check
          trap 'docker logs muni-smoke; docker rm --force muni-smoke' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:19458/healthz
          curl --fail http://127.0.0.1:19458/vendor/maplibre-gl/maplibre-gl-worker.mjs --output /dev/null
      - name: Scan fixable high and critical container vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.0 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 muni-security-check
